name: Rotina

on:
  schedule:
    - cron: '23 11 * * *'
    - cron: '47 14 * * *'
    - cron: '11 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rotina
  cancel-in-progress: false

jobs:
  registro:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Registrar
        env:
          TZ: America/Sao_Paulo
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          git config user.name "$OWNER"
          git config user.email "${OWNER_ID}+${OWNER}@users.noreply.github.com"
          mkdir -p .github/rotina
          now=$(date '+%Y-%m-%d %H:%M:%S %z')
          echo "$now" >> .github/rotina/registro.log
          tail -n 400 .github/rotina/registro.log > .github/rotina/registro.tmp && mv .github/rotina/registro.tmp .github/rotina/registro.log
          git add -f .github/rotina/registro.log
          git commit -m "Atualiza registro de $(date '+%d/%m/%Y %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 10))
          done
          exit 1
